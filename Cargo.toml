# Playtime Tracker: the background tracker, the dashboard and their shared libraries (see docs/architecture/).
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/LunoviaVR/PlaytimeTracker"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
