name: Smoke test screenshots

# Builds and installs the app on Windows, runs the end-to-end smoke test, screenshots every dashboard page at several
# sizes, and commits them to docs/smoke-test/ on this branch so they can be reviewed without installing anything.
# Run it by hand from the Actions tab; it also runs when the dashboard, the smoke test or this workflow changes on a
# branch. Its own commit (docs/smoke-test/*.png) doesn't trigger it again.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "crates/playtime-dashboard/**"
      - "crates/playtime-smoke-test/**"
      - ".github/workflows/smoke-test-screenshots.yml"

permissions:
  contents: read

concurrency:
  group: smoke-test-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: windows-latest
    permissions:
      contents: write # to commit the screenshots to this branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Build the installer
        shell: pwsh
        run: |
          rustup show active-toolchain
          ./build.ps1

      - name: Install, smoke test with screenshots, uninstall
        shell: pwsh
        run: |
          Start-Process -FilePath publish/PlaytimeTrackerSetup.exe -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Playtime Tracker'
          cargo run --release --locked -p playtime-smoke-test -- $dir docs/smoke-test
          $code = $LASTEXITCODE
          Start-Process -FilePath (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S' -Wait
          exit $code

      - name: Commit the screenshots
        # Also after a failed smoke test (the job stays red): the screenshots show what went wrong.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/smoke-test/*.png
          if (git diff --cached --quiet) { Write-Host "Screenshots unchanged."; exit 0 }
          git commit -m "Update smoke test screenshots"
          # Other commits may have landed on the branch during the run; put the screenshots on top of them.
          git pull --rebase
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git push
