name: XAML bisect (temporary)

# Temporary: finds which part of the parity change crashes the XAML compiler (WMC9999). Each job undoes one part.
on:
  push:
    branches: ["claude/epic-rubin-ptpyds"]
    paths:
      - ".github/workflows/xaml-bisect.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [control, inproc, settings-old, overview-old, no-gamerow, no-header, no-chart-caption]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Apply variant
        shell: python
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          import os, re, subprocess
          v = os.environ["VARIANT"]
          p = "dashboard/PlaytimeTracker.Dashboard/Pages/OverviewPage.xaml"
          if v == "settings-old":
              subprocess.run(["git", "checkout", "55c93b8", "--", "dashboard/PlaytimeTracker.Dashboard/Pages/SettingsPage.xaml"], check=True)
          elif v == "overview-old":
              subprocess.run(["git", "checkout", "55c93b8", "--", p], check=True)
          elif v in ("no-gamerow", "no-header", "no-chart-caption"):
              s = open(p, encoding="utf-8").read()
              if v == "no-gamerow":
                  s = re.sub(r'\s*<DataTemplate x:Key="GameRowTemplate".*?</DataTemplate>', "", s, flags=re.S)
                  s = s.replace('ItemTemplate="{StaticResource GameRowTemplate}"', "")
              elif v == "no-header":
                  s = s.replace(' TextTrimming="CharacterEllipsis" />\n                <Button', ' />\n                <Button')
                  s = s.replace('<Grid ColumnSpacing="12" Margin="0,0,0,16">', '<Grid Margin="0,0,0,16">')
              else:
                  s = s.replace('<TextBlock Text="Select a day to see its sessions." Style="{StaticResource CaptionStyle}" />', "")
              open(p, "w", encoding="utf-8").write(s)
          subprocess.run(["git", "diff", "--stat"])

      - name: Build dashboard (x64)
        shell: pwsh
        run: |
          $extra = if ('${{ matrix.variant }}' -eq 'inproc') { '-p:UseXamlCompilerExecutable=false' } else { '' }
          dotnet build dashboard/PlaytimeTracker.Dashboard --configuration Release --runtime win-x64 -p:Platform=x64 $extra 2>&1 | Select-String -Pattern 'error|Build succeeded' | Select-Object -First 40
          $out = Get-ChildItem -Recurse dashboard/PlaytimeTracker.Dashboard/obj -Filter output.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($out) { Get-Content $out.FullName -Raw | Select-Object -First 1 }
