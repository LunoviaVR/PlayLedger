name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: jobs get read-only access unless they ask for more (only the release job does).
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # later steps never need the token, so don't leave it in .git/config

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Check for vulnerable NuGet packages
        shell: pwsh
        run: |
          dotnet restore src/GameSessionTracker
          $report = dotnet list src/GameSessionTracker package --vulnerable --include-transitive
          $report
          if ($report -match 'has the following vulnerable packages') { exit 1 }

      - name: Build app and installers
        shell: pwsh
        # Ref values are passed as environment variables, never pasted into the script text, so a branch or tag
        # name can't inject PowerShell. build.ps1 also rejects anything that isn't a plain x.y.z version.
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:GIT_REF -like 'refs/tags/v*') { $env:GIT_REF_NAME.Substring(1) } else { '2.2.0' }
          ./build.ps1 -Version $version

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PlaytimeTracker-Installers
          path: |
            publish/PlaytimeTrackerSetup.exe
            publish/PlaytimeTrackerSetup-Online.exe
          if-no-files-found: error
          retention-days: 30

  # The next app (Rust tracker + Rust dashboard) as a preview installer artifact, for testing on real PCs.
  # Not attached to releases: those keep shipping the C# app above until the new one is verified.
  preview:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      # rustup is preinstalled on the runner; rust-toolchain.toml pins the exact toolchain.
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show active-toolchain

      - name: Build tracker, dashboard and preview installer
        shell: pwsh
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:GIT_REF -like 'refs/tags/v*') { $env:GIT_REF_NAME.Substring(1) } else { '2.2.0' }
          ./build-next.ps1 -Version $version

      - name: Upload preview installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PlaytimeTracker-Preview
          path: publish/PlaytimeTrackerSetup-Preview.exe
          if-no-files-found: error
          retention-days: 30

      # End-to-end on this real Windows machine: install silently, drive the installed tracker over its pipe
      # (tracking a real process, protected storage, restart), screenshot the dashboard, then uninstall.
      - name: Install the preview silently
        shell: pwsh
        run: |
          Start-Process -FilePath publish/PlaytimeTrackerSetup-Preview.exe -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Playtime Tracker'
          foreach ($file in 'playtime-tracker.exe', 'Uninstall.exe', 'Dashboard\PlaytimeTracker.Dashboard.exe') {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "$file wasn't installed" }
          }
          $run = Get-ItemPropertyValue 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name PlaytimeTracker
          if ($run -notlike '*playtime-tracker.exe*--startup*') { throw "unexpected Run entry: $run" }

      - name: Smoke test the installed app
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Playtime Tracker'
          cargo run --release --locked -p playtime-smoke-test -- $dir publish/screenshots

      - name: Show Windows application errors (on failure)
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 1, 2; StartTime = (Get-Date).AddMinutes(-20) } -ErrorAction SilentlyContinue |
            Select-Object -First 15 | Format-List TimeCreated, ProviderName, Id, Message

      - name: Upload dashboard screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PlaytimeTracker-Preview-Screenshots
          path: publish/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Uninstall silently (history kept)
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Playtime Tracker'
          Start-Process -FilePath (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S' -Wait
          # The uninstaller copies itself to a temp folder and finishes there; give it time.
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir 'playtime-tracker.exe')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir 'playtime-tracker.exe')) { throw 'the tracker is still installed' }
          if (Test-Path (Join-Path $dir 'Dashboard')) { throw 'the dashboard is still installed' }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name PlaytimeTracker -ErrorAction SilentlyContinue) { throw 'the Run entry is still there' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PlaytimeTracker') { throw 'the Apps entry is still there' }
          $data = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Playtime Tracker\sessions.dat'
          if (-not (Test-Path $data)) { throw 'the play history was removed' }
          Write-Host 'Uninstalled; play history kept.'

  release:
    # Only version tags publish a release, and only this job can write to the repository.
    # The release carries a single installer, Setup.exe (the online installer); the app's updater looks for that name.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: docs/releases

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PlaytimeTracker-Installers
          path: publish

      - name: Prepare Setup.exe and release notes
        id: prepare
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp publish/PlaytimeTrackerSetup-Online.exe publish/Setup.exe
          notes="docs/releases/${TAG}.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notes.md"
            echo "Playtime Tracker ${TAG#v}" > "$notes"
          fi
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Playtime Tracker ${{ github.ref_name }}
          body_path: ${{ steps.prepare.outputs.notes }}
          files: publish/Setup.exe
          fail_on_unmatched_files: true
