name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: jobs get read-only access unless they ask for more (only the release job does).
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # later steps never need the token, so don't leave it in .git/config

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Check for vulnerable NuGet packages
        shell: pwsh
        run: |
          dotnet restore src/GameSessionTracker
          $report = dotnet list src/GameSessionTracker package --vulnerable --include-transitive
          $report
          if ($report -match 'has the following vulnerable packages') { exit 1 }

      - name: Build app and installers
        shell: pwsh
        # Ref values are passed as environment variables, never pasted into the script text, so a branch or tag
        # name can't inject PowerShell. build.ps1 also rejects anything that isn't a plain x.y.z version.
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:GIT_REF -like 'refs/tags/v*') { $env:GIT_REF_NAME.Substring(1) } else { '2.2.0' }
          ./build.ps1 -Version $version

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PlaytimeTracker-Installers
          path: |
            publish/PlaytimeTrackerSetup.exe
            publish/PlaytimeTrackerSetup-Online.exe
          if-no-files-found: error
          retention-days: 30

  release:
    # Only version tags publish a release, and only this job can write to the repository.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PlaytimeTracker-Installers
          path: publish

      - name: Attach installers to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            publish/PlaytimeTrackerSetup.exe
            publish/PlaytimeTrackerSetup-Online.exe
