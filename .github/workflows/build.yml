name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "To publish a release, the version (x.y.z, the same as Cargo.toml). It creates the tag vX.Y.Z on this commit. Leave empty to only build and test."
        required: false
        type: string

# Least privilege: jobs get read-only access unless they ask for more (only the release job does).
permissions:
  contents: read

jobs:
  # Builds the tracker, the dashboard and the installer, then installs it on this real Windows machine and runs the
  # end-to-end smoke test (tracking a real process, protected storage, restart, dashboard screenshots), then
  # uninstalls it.
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # later steps never need the token, so don't leave it in .git/config

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      # rustup is preinstalled on the runner; rust-toolchain.toml pins the exact toolchain.
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show active-toolchain

      - name: Build the app and installer
        shell: pwsh
        # Ref names and inputs are passed as environment variables, never pasted into the script text, so they can't
        # inject PowerShell. build.ps1 also rejects anything that isn't a plain x.y.z matching Cargo.toml.
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GIT_REF -like 'refs/tags/v*') { $env:GIT_REF_NAME.Substring(1) } else { $env:INPUT_VERSION }
          if ($version) { ./build.ps1 -Version $version } else { ./build.ps1 }

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PlaytimeTracker-Setup
          path: publish/PlaytimeTrackerSetup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Install silently
        shell: pwsh
        run: |
          Start-Process -FilePath publish/PlaytimeTrackerSetup.exe -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Playtime Tracker'
          foreach ($file in 'playtime-tracker.exe', 'Uninstall.exe', 'Dashboard\PlaytimeTracker.Dashboard.exe') {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "$file wasn't installed" }
          }
          $run = Get-ItemPropertyValue 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name PlaytimeTracker
          if ($run -notlike '*playtime-tracker.exe*--startup*') { throw "unexpected Run entry: $run" }

      - name: Smoke test the installed app
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Playtime Tracker'
          cargo run --release --locked -p playtime-smoke-test -- $dir publish/screenshots

      - name: Show Windows application errors (on failure)
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 1, 2; StartTime = (Get-Date).AddMinutes(-20) } -ErrorAction SilentlyContinue |
            Select-Object -First 15 | Format-List TimeCreated, ProviderName, Id, Message

      - name: Upload dashboard screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PlaytimeTracker-Screenshots
          path: publish/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Uninstall silently (history kept)
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Playtime Tracker'
          Start-Process -FilePath (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S' -Wait
          # The uninstaller copies itself to a temp folder and finishes there; give it time.
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir 'playtime-tracker.exe')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir 'playtime-tracker.exe')) { throw 'the tracker is still installed' }
          if (Test-Path (Join-Path $dir 'Dashboard')) { throw 'the dashboard is still installed' }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name PlaytimeTracker -ErrorAction SilentlyContinue) { throw 'the Run entry is still there' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PlaytimeTracker') { throw 'the Apps entry is still there' }
          $data = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Playtime Tracker\sessions.dat'
          if (-not (Test-Path $data)) { throw 'the play history was removed' }
          Write-Host 'Uninstalled; play history kept.'

  release:
    # A version tag, or a manual run given a version, publishes a release; only this job can write to the repository.
    # The release carries a single installer, Setup.exe: the name the app's updater looks for, so earlier
    # versions upgrade in place.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: docs/releases

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PlaytimeTracker-Setup
          path: publish

      - name: Prepare Setup.exe and release notes
        id: prepare
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GIT_REF" == refs/tags/v* ]]; then
            tag="$GIT_REF_NAME"
          else
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}$ ]]; then
              echo "::error::The version must look like 3.0.0"; exit 1
            fi
            tag="v$INPUT_VERSION"
            # Never move or reuse an existing tag.
            status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/git/ref/tags/$tag")
            if [ "$status" != "404" ]; then
              echo "::error::The tag $tag already exists (or couldn't be checked: HTTP $status)"; exit 1
            fi
          fi
          cp publish/PlaytimeTrackerSetup.exe publish/Setup.exe
          notes="docs/releases/${tag}.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notes.md"
            echo "Playtime Tracker ${tag#v}" > "$notes"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Playtime Tracker ${{ steps.prepare.outputs.tag }}
          body_path: ${{ steps.prepare.outputs.notes }}
          files: publish/Setup.exe
          fail_on_unmatched_files: true
