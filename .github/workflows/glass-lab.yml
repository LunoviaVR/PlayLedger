name: Glass lab

# TEMPORARY: reproduces the dashboard's glass look on a real Windows desktop. The runner has no GPU, so Mesa's
# llvmpipe (software OpenGL) is placed next to the dashboard. A striped window is shown behind it and the composited
# screen is captured for each variant of the backdrop code (PLAYTIME_GLASS_LAB). Results go to docs/glass-lab/.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/glass-lab.yml"

permissions:
  contents: read

jobs:
  lab:
    runs-on: windows-latest
    permissions:
      contents: write # to commit the captures to this branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the dashboard
        shell: pwsh
        run: |
          cargo build --release --locked -p playtime-dashboard
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Add Mesa's software OpenGL next to it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo pal1000/mesa-dist-win --pattern "mesa3d-*-release-msvc.7z" --dir mesa
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          7z x (Get-ChildItem mesa\*.7z)[0].FullName -omesa\x -y | Out-Null
          Copy-Item mesa\x\x64\*.dll target\release\
          Get-ChildItem target\release\*.dll | ForEach-Object { $_.Name }

      - name: Capture each variant over a striped background
        shell: pwsh
        run: |
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          if (-not (Test-Path $key)) { New-Item $key -Force | Out-Null }
          Set-ItemProperty $key EnableTransparency 1 -Type DWord
          Set-ItemProperty $key AppsUseLightTheme 0 -Type DWord

          $out = 'docs\glass-lab'
          New-Item -ItemType Directory $out -Force | Out-Null
          $bg = @'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $f = New-Object System.Windows.Forms.Form
          $f.FormBorderStyle = 'None'; $f.WindowState = 'Maximized'; $f.BackColor = 'White'
          $f.Add_Paint({ param($s, $e)
            $colors = 'Red','Lime','Blue','Yellow','Magenta','Cyan','Orange','White'
            $w = [int]($f.ClientSize.Width / $colors.Count)
            for ($i = 0; $i -lt $colors.Count; $i++) {
              $e.Graphics.FillRectangle((New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromName($colors[$i]))), $i * $w, 0, $w, $f.ClientSize.Height)
            }
          })
          [System.Windows.Forms.Application]::Run($f)
          '@
          Set-Content bg.ps1 $bg
          $background = Start-Process pwsh -ArgumentList '-NoProfile', '-File', 'bg.ps1' -PassThru
          Start-Sleep 5

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Capture($path) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          Capture "$out\background.png"

          $variants = [ordered]@{
            'shipped' = ''; 'noblur' = 'noblur'; 'noextend' = 'noextend'; 'noblur-noextend' = 'noblur,noextend';
            'mica' = 'mica'; 'mica-noblur' = 'mica,noblur'
          }
          $env:GALLIUM_DRIVER = 'llvmpipe'
          foreach ($name in $variants.Keys) {
            $env:PLAYTIME_GLASS_LAB = $variants[$name]
            $env:PLAYTIME_GLASS_LOG = (Join-Path $PWD "$out\$name-glass.txt")
            $env:PLAYTIME_RENDERER_LOG = (Join-Path $PWD "$out\$name-renderer.txt")
            $p = Start-Process target\release\playtime-dashboard.exe -PassThru
            Start-Sleep 10
            Capture "$out\$name.png"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep 2
          }
          Stop-Process -Id $background.Id -Force -ErrorAction SilentlyContinue
          Get-ChildItem $out | ForEach-Object { "{0} {1}" -f $_.Name, $_.Length }
          Get-ChildItem $out\*.txt | ForEach-Object { "== $($_.Name)"; Get-Content $_ }
          Get-ChildItem $env:LOCALAPPDATA\'Playtime Tracker'\*.log -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.Name)"; Get-Content $_ }

      - name: Commit the captures
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/glass-lab
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Nothing captured."; exit 0 }
          git commit -m "Glass lab captures"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git pull --rebase
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git push
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
