name: Screenshots

# Re-renders the README screenshots (docs/*.png) on Windows from the real dashboard code with sample data
# (tools/Screenshots), and commits them back to the branch. Run it by hand from the Actions tab after UI changes;
# it also runs when the screenshot tool itself changes on a branch.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "tools/Screenshots/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: windows-latest
    permissions:
      contents: write # to commit the refreshed images to this branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Render screenshots
        shell: pwsh
        run: dotnet run -c Release --project tools/Screenshots -- docs

      - name: Keep a copy as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/*.png
          retention-days: 14

      - name: Commit updated screenshots
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.png
          if (git diff --cached --quiet) { Write-Host "Screenshots unchanged."; exit 0 }
          git commit -m "Update README screenshots"
          git push
