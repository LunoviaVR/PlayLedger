name: Screenshots

# Re-renders the README screenshots (docs/*.png) on Windows with the dashboard's own renderer
# (`playtime-dashboard --render`) from the sample data in crates/playtime-dashboard/fixtures, and commits them back
# to the branch. Run it by hand from the Actions tab after UI changes; it also runs when the dashboard's UI changes
# on a branch.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "crates/playtime-dashboard/ui/**"
      - "crates/playtime-dashboard/fixtures/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: windows-latest
    permissions:
      contents: write # to commit the refreshed images to this branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup is preinstalled on the runner; rust-toolchain.toml pins the exact toolchain.
      - name: Render screenshots
        shell: pwsh
        run: |
          rustup show active-toolchain
          cargo build --release --locked -p playtime-dashboard
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = 'target\release\playtime-dashboard.exe'
          $data = 'crates\playtime-dashboard\fixtures\responses.jsonl'
          $shots = @(
            @('overview', 'docs\dashboard.png', '--dark'),
            @('overview', 'docs\dashboard-light.png', $null),
            @('games', 'docs\games.png', '--dark'),
            @('history', 'docs\history.png', '--dark'),
            @('settings', 'docs\settings.png', '--dark'),
            @('overview', 'docs\session-details.png', '--dark', '--dialog', 'session'),
            @('overview', 'docs\glass.png', '--dark', '--glass'),
            @('games', 'docs\glass-light.png', '--glass')
          )
          foreach ($s in $shots) {
            $extra = @($s[2..($s.Count - 1)] | Where-Object { $_ })
            Remove-Item $s[1] -ErrorAction SilentlyContinue
            # The dashboard is a GUI app, so PowerShell's `&` wouldn't wait for it: wait for each render explicitly.
            $render = Start-Process -FilePath $exe -ArgumentList (@('--render', $s[0], '1180x760', $s[1], $data) + $extra) -NoNewWindow -Wait -PassThru
            if ($render.ExitCode) { throw "rendering $($s[1]) failed ($($render.ExitCode))" }
            if (-not (Test-Path $s[1])) { throw "$($s[1]) wasn't written" }
          }

      - name: Keep a copy as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: docs/*.png
          retention-days: 14

      - name: Commit updated screenshots
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.png
          # `if (git ...)` would test the command's output, not its exit code: check the exit code.
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Screenshots unchanged."; exit 0 }
          git commit -m "Update README screenshots"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Other commits may have landed on the branch during the run; put the screenshots on top of them.
          git pull --rebase
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git push
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
