# Keeps the GitHub Actions used by the Build workflow (and any NuGet packages, should the app ever take one) up to
# date, including security fixes.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/src/GameSessionTracker"
    schedule:
      interval: "weekly"
