[package]
name = "playtime-windows"
description = "Windows integrations for Playtime Tracker: DPAPI data protection, registry, file locks and process enumeration."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
playtime-core = { path = "../playtime-core" }
thiserror = "2.0.21"

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_Environment"] }
