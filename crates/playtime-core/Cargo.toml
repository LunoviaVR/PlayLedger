[package]
name = "playtime-core"
description = "Platform-independent core of PlayLedger: domain model, session tracking, game matching, launcher metadata parsing, settings, protected-file format and update parsing."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
