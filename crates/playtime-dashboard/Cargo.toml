[package]
name = "playtime-dashboard"
description = "Playtime Tracker's dashboard window (Slint, Fluent style); all data comes from playtime-tracker.exe over its named pipe."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "playtime-dashboard"
path = "src/main.rs"

[dependencies]
playtime-core = { path = "../playtime-core" }
# Pure-Rust rendering only: femtovg (GPU, OpenGL) for hardware acceleration and the software renderer without it.
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }

[build-dependencies]
slint-build = "1.18.1"
